openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Firebox dashboard operations
  - name: projects
    description: Project lifecycle and intelligence
  - name: templates
    description: Starter project templates
  - name: deployments
    description: Deployment orchestration
  - name: usage
    description: Usage and credit summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create or import a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/intelligence:
    get:
      operationId: getProjectIntelligence
      tags: [projects]
      summary: Get project intelligence
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Detected project stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIntelligence"
  /projects/{projectId}/activity:
    get:
      operationId: getProjectActivity
      tags: [projects]
      summary: Get recent agent activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Agent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /projects/{projectId}/agent-runs:
    post:
      operationId: createAgentRun
      tags: [projects]
      summary: Start an agent run
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunInput"
      responses:
        "202":
          description: Agent run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /templates:
    get:
      operationId: getTemplates
      tags: [templates]
      summary: List project templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
  /deployments:
    get:
      operationId: getDeployments
      tags: [deployments]
      summary: List deployments
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
  /projects/{projectId}/deployments:
    post:
      operationId: createDeployment
      tags: [deployments]
      summary: Start a deployment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentInput"
      responses:
        "202":
          description: Deployment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Get usage and credits
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      required: [id, name, slug, source, framework, status, updatedAt, color]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        source: { type: string, enum: [prompt, github, zip] }
        framework: { type: string }
        runtime: { type: string }
        status: { type: string, enum: [ready, running, needs-setup, deploying] }
        updatedAt: { type: string }
        color: { type: string }
        description: { type: ["string", "null"] }
        repository: { type: ["string", "null"] }
    ProjectInput:
      type: object
      required: [name, source]
      properties:
        name: { type: string, minLength: 1 }
        source: { type: string, enum: [prompt, github, zip] }
        prompt: { type: ["string", "null"] }
        repository: { type: ["string", "null"] }
        framework: { type: ["string", "null"] }
    ProjectIntelligence:
      type: object
      required: [language, framework, runtime, packageManager, buildTool, devCommand, buildCommand, structure, confidence]
      properties:
        language: { type: string }
        framework: { type: string }
        runtime: { type: string }
        packageManager: { type: string }
        buildTool: { type: string }
        devCommand: { type: string }
        buildCommand: { type: string }
        confidence: { type: number }
        structure:
          type: array
          items: { type: string }
        database:
          type: ["string", "null"]
    Activity:
      type: object
      required: [id, label, status, timestamp]
      properties:
        id: { type: string }
        label: { type: string }
        detail: { type: ["string", "null"] }
        status: { type: string, enum: [complete, active, queued, failed] }
        timestamp: { type: string }
    AgentRunInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
    AgentRun:
      type: object
      required: [id, prompt, status, currentOperation]
      properties:
        id: { type: string }
        prompt: { type: string }
        status: { type: string, enum: [queued, running, complete, failed] }
        currentOperation: { type: string }
    Template:
      type: object
      required: [id, name, description, framework, category, color]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        framework: { type: string }
        category: { type: string }
        color: { type: string }
    DeploymentInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [vercel, railway, render, heroku, netlify, cloudflare, digitalocean, azure] }
        environment: { type: string, enum: [preview, production] }
    Deployment:
      type: object
      required: [id, projectId, projectName, provider, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        provider: { type: string }
        status: { type: string, enum: [live, building, failed, paused] }
        url: { type: ["string", "null"] }
        createdAt: { type: string }
    Usage:
      type: object
      required: [creditsUsed, creditsTotal, computeUsed, computeTotal, resetDate]
      properties:
        creditsUsed: { type: number }
        creditsTotal: { type: number }
        computeUsed: { type: number }
        computeTotal: { type: number }
        resetDate: { type: string }
    Dashboard:
      type: object
      required: [projects, deployments, activeRuns, recentActivity, usage]
      properties:
        projects: { type: number }
        deployments: { type: number }
        activeRuns: { type: number }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        usage:
          $ref: "#/components/schemas/Usage"

