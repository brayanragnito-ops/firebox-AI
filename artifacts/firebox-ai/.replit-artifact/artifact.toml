kind = "web"
previewPath = "/"
title = "Firebox AI"
description = "A professional browser-based AI development platform where users create, import, edit, run, debug, and deploy software projects with an operational AI agent, project intelligence, secure execution, GitHub workflows, and provider-based deployment orchestration."
version = "1.0.0"
id = "artifacts/firebox-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19247

[services.development]
run = "pnpm --filter @workspace/firebox-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firebox-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/firebox-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19247"
BASE_PATH = "/"
